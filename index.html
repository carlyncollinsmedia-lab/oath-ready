<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oath Ready</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oath Ready">
<meta name="theme-color" content="#FBF8F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141214" media="(prefers-color-scheme: dark)">
<style>
/* fonts ship with the app: no outside requests */
@font-face{font-family:"Young Serif";src:url(fonts/young-serif.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url(fonts/figtree.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/plex-mono-500.woff2) format("woff2");font-weight:500;font-display:swap}
/* Layout: one narrow study column under a sticky tab bar; the chapter list is the spine of every view. */
:root{
  --paper:#FBF8F7; --card:#FFFFFF; --ink:#1D1A1C; --muted:#6C6367; --line:#E8DEDC;
  --red:#C8102E; --red-soft:#F9E4E6; --on-red:#FFFFFF;
  --good:#1D7A4C; --good-soft:#E0F2E7; --bad:#B42318; --bad-soft:#FBE6E3;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141214; --card:#1D1A1D; --ink:#F3EEEF; --muted:#A99FA3; --line:#322B2F;
  --red:#FF5A6C; --red-soft:#3B1C23; --on-red:#1A0A0D;
  --good:#52C78F; --good-soft:#16301F; --bad:#FF7466; --bad-soft:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141214; --card:#1D1A1D; --ink:#F3EEEF; --muted:#A99FA3; --line:#322B2F;
  --red:#FF5A6C; --red-soft:#3B1C23; --on-red:#1A0A0D;
  --good:#52C78F; --good-soft:#16301F; --bad:#FF7466; --bad-soft:#3A1A17; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-size:14px;font-weight:600;background:none;border:0;color:var(--muted);padding:8px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--red)}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:999px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{font-size:13px;padding:6px 12px}

/* overview */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring>div{width:96px;height:96px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--f-mono);font-size:24px;display:block;line-height:1}
.ring small{font-size:11px;color:var(--muted)}
.format{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.format div{background:var(--card);padding:12px 14px}
.format b{font-family:var(--f-mono);font-size:22px;display:block}
.format span{font-size:13px;color:var(--muted)}
.chlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ch{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ch .n{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.ch .t{min-width:0}
.ch .t div{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--red)}
.bar i.full{background:var(--good)}
.mocks{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:13px;padding:3px 9px;border-radius:999px;background:var(--bad-soft);color:var(--bad)}
.chip.pass{background:var(--good-soft);color:var(--good)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--red);transition:width .2s}
.qtext{font-family:var(--f-display);font-size:22px;line-height:1.3;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .k{font-family:var(--f-mono);font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;text-align:center;line-height:22px}
.opt.sel{border-color:var(--red);background:var(--red-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{border-left:3px solid var(--good);padding:4px 0 4px 14px}
.explain.no{border-left-color:var(--bad)}
.grid20{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid20 button{font-family:var(--f-mono);font-size:13px;padding:6px 0;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.grid20 button.done{background:var(--red-soft);color:var(--ink);border-color:transparent}
.grid20 button.cur{border-color:var(--red);color:var(--ink)}
.timer{font-family:var(--f-mono);font-size:18px}
.timer.low{color:var(--bad)}
.score{font-family:var(--f-mono);font-size:56px;line-height:1}
.review{display:flex;flex-direction:column;gap:14px}
.review .item{padding-bottom:14px;border-bottom:1px solid var(--line)}
.review .item:last-child{border-bottom:0;padding-bottom:0}
.ok{color:var(--good);font-weight:600} .no{color:var(--bad);font-weight:600}

/* cards */
.card3d{perspective:1200px;cursor:pointer}
.card3d .inner{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.card3d.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--red-soft);border-color:transparent}
.face .qtext{font-size:21px}

/* learn */
.facts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:65ch}
details.chap{border-bottom:1px solid var(--line);padding:4px 0}
details.chap summary{cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;gap:12px;font-weight:600;list-style:none}
details.chap summary::-webkit-details-marker{display:none}
details.chap summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.chap[open] summary::after{content:"–"}
details.chap .body{padding:0 0 18px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
a{color:var(--red)}
.note{font-size:14px;color:var(--muted);max-width:65ch}
/* read aloud */
.speak{font:inherit;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.speak svg{width:16px;height:16px}
.speak.on{border-color:var(--red);color:var(--red)}
.listen-now{min-height:200px;display:flex;flex-direction:column;gap:12px}
.listen-now .phase{font-family:var(--f-mono);font-size:13px;color:var(--red)}
.bigctl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bigctl .btn{min-width:88px;padding:14px 20px;font-size:16px}
.set{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.set label{font-weight:600}
.set small{display:block;color:var(--muted);font-weight:400}
.set select,.set input[type=range]{font:inherit;max-width:180px}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:left .15s}
.switch:checked{background:var(--red)}
.switch:checked::after{left:21px}
.format div,.hero>*,.qhead>*{min-width:0}
@media (max-width:520px){
  .brand span{display:none}
  .hero{grid-template-columns:1fr;justify-items:start}
  h1{font-size:26px}
  .qtext{font-size:20px}
  .grid20{grid-template-columns:repeat(5,1fr)}
  .format b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){.card3d .inner,.progress i{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--red)"/><path fill="var(--on-red)" d="M16 5l1.6 3.4 2.1-1-.6 5.2 3-2.6.7 1.9 3-.6-1.1 3.4 1.6.9-4.6 3.8.7 1.9-4.7-.6.2 4.9h-1.8l.2-4.9-4.7.6.7-1.9-4.6-3.8 1.6-.9-1.1-3.4 3 .6.7-1.9 3 2.6-.6-5.2 2.1 1z"/></svg>
    <div><b>Oath Ready</b> <span>· Canadian citizenship test prep</span></div>
  </div>
  <nav id="nav" aria-label="Sections">
    <button data-go="home">Overview</button>
    <button data-go="learn">Study guide</button>
    <button data-go="cards">Flashcards</button>
    <button data-go="practice">Practice</button>
    <button data-go="listen">Listen</button>
    <button data-go="mock">Mock test</button>
    <button data-go="settings">Settings</button>
  </nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
const CH=[
 {k:"rights",n:"Rights and responsibilities"},
 {k:"who",n:"Who we are"},
 {k:"history",n:"Canada's history"},
 {k:"modern",n:"Modern Canada"},
 {k:"govt",n:"How Canadians govern themselves"},
 {k:"elections",n:"Federal elections"},
 {k:"justice",n:"The justice system"},
 {k:"symbols",n:"Canadian symbols"},
 {k:"economy",n:"Canada's economy"},
 {k:"regions",n:"Canada's regions"}
];
// [chapter, question, correct, [wrong x3], fact]
const RAW=[
["rights","What are the four fundamental freedoms in the Canadian Charter of Rights and Freedoms?","Conscience and religion; thought, belief, opinion and expression; peaceful assembly; association",["Speech, voting, travel and employment","Health care, education, housing and work","Religion, property, privacy and trade"],"The fundamental freedoms are freedom of conscience and religion; of thought, belief, opinion and expression (including speech and the press); of peaceful assembly; and of association."],
["rights","In what year was the Canadian Charter of Rights and Freedoms added to the Constitution?","1982",["1867","1960","1931"],"The Constitution was amended in 1982 to entrench the Canadian Charter of Rights and Freedoms."],
["rights","What is the Magna Carta?","The Great Charter of Freedoms, signed in England in 1215",["Canada's first constitution, signed in 1867","A treaty between France and England in 1763","The royal charter that created the Hudson's Bay Company"],"The Magna Carta (Great Charter of Freedoms), signed in England in 1215, is the oldest source of the rights and freedoms Canadians inherited."],
["rights","What does habeas corpus mean?","The right to challenge unlawful detention by the state",["The right to vote by secret ballot","The right to a free lawyer in every case","The right to own property"],"Habeas corpus is the right to challenge unlawful detention by the state. It comes from English common law."],
["rights","Which of these is a mobility right?","Living and working anywhere in Canada, and entering and leaving the country freely",["Driving in any province without a licence","Crossing any border without a passport","Moving into any empty home"],"Mobility rights: Canadians can live and work anywhere in Canada, enter and leave the country freely, and apply for a passport."],
["rights","Which of these is a responsibility of citizenship?","Serving on a jury when called",["Joining a political party","Owning a home","Speaking both official languages"],"Responsibilities include obeying the law, taking responsibility for yourself and your family, serving on a jury, voting, helping others, and protecting our heritage and environment."],
["rights","Is military service compulsory in Canada?","No, but serving in the Canadian Forces is a noble way to contribute",["Yes, for all citizens aged 18 to 25","Yes, for one year after high school","Only for new citizens"],"There is no compulsory military service in Canada. Serving in the regular forces, the reserves, the Coast Guard, police or fire services is a noble way to contribute."],
["rights","What does Canadian law say about the equality of women and men?","They are equal under the law; spousal abuse, honour killings and forced marriage are crimes",["Men are the legal head of the household","Equality applies only in the workplace","Each community may set its own rules"],"In Canada, men and women are equal under the law. Barbaric cultural practices such as spousal abuse, honour killings, female genital mutilation and forced marriage are crimes."],
["rights","Which document begins: Canada is founded upon principles that recognize the supremacy of God and the rule of law?","The Canadian Charter of Rights and Freedoms",["The British North America Act","The Quebec Act","The Magna Carta"],"The Charter opens with the words: Canada is founded upon principles that recognize the supremacy of God and the rule of law."],
["rights","Canadian law draws on which of these sources?","Laws passed by Parliament and the provinces, English common law, and the civil code of France",["Only laws written since 1982","Only the laws of the United Kingdom","Only Aboriginal treaties"],"Canadian law has several sources: laws passed by Parliament and the provincial legislatures, English common law, the civil code of France, and the unwritten constitution inherited from Great Britain."],
["rights","How does the Charter treat the rights of Aboriginal peoples?","It does not adversely affect treaty or other rights of Aboriginal peoples",["It replaces all treaties","It applies only to First Nations living on reserves","It removes their rights to land"],"The rights guaranteed in the Charter will not adversely affect any treaty or other rights or freedoms of Aboriginal peoples."],
["rights","Which of these is NOT a responsibility of citizenship?","Buying Canadian-made products",["Obeying the law","Voting in elections","Protecting the environment"],"Buying Canadian products is a personal choice. Obeying the law, voting and protecting our heritage and environment are responsibilities."],
["rights","What status do English and French have under the Charter?","Equal status in Parliament and throughout the federal government",["French is official only in Quebec","English is primary and French is secondary","Neither is an official language"],"English and French have equal status in Parliament and throughout the government of Canada."],
["rights","What does the Charter say about multiculturalism?","It is a fundamental characteristic of Canadian heritage and identity",["It applies only to new immigrants","It is not mentioned","It is limited to Quebec"],"The Charter recognizes multiculturalism as a fundamental characteristic of Canadian heritage and identity."],

["who","Who are the three founding peoples of Canada?","Aboriginal, French and British",["English, Scottish and Irish","French, Spanish and British","Inuit, Métis and Acadian"],"Canada's three founding peoples are Aboriginal, French and British."],
["who","What are the three main groups of Aboriginal peoples?","First Nations, Inuit and Métis",["Cree, Mohawk and Haida","Acadians, Inuit and Métis","Ojibwe, Inuit and Loyalists"],"The term Aboriginal peoples refers to three distinct groups: Indians (First Nations), Inuit and Métis."],
["who","What does the word Inuit mean in Inuktitut?","The people",["The land","The hunters","The north"],"Inuit means 'the people' in the Inuktitut language. Inuit live in small communities across the Arctic."],
["who","Who are the Métis?","A distinct people of mixed Aboriginal and European ancestry",["French settlers in the Maritimes","Early British fur traders","An Inuit community in Nunavut"],"The Métis are a distinct people of mixed Aboriginal and European ancestry. The majority live in the Prairie provinces."],
["who","Who are the Acadians?","Descendants of French colonists who began settling in the Maritimes in 1604",["Loyalists who came from the United States","Scottish settlers in Nova Scotia","Early Viking settlers"],"The Acadians are descendants of French colonists who began settling in what are now the Maritime provinces in 1604."],
["who","What was the Great Upheaval?","The deportation of the Acadians by the British, 1755 to 1763",["The 1837 rebellions","The gold rush in the Yukon","The building of the railway"],"Between 1755 and 1763, more than two-thirds of the Acadians were deported from their homeland. This is known as the Great Upheaval."],
["who","In 2006, what did the House of Commons recognize?","That Quebecers form a nation within a united Canada",["That Quebec is a separate country","That French is Canada's only official language","That Quebec has its own army"],"In 2006 the House of Commons recognized that the Quebecers form a nation within a united Canada."],
["who","What were residential schools meant to do?","Assimilate Aboriginal children by separating them from their families and culture",["Teach Aboriginal languages","Train teachers for the North","Educate immigrant children"],"From the 1800s until the 1980s, the federal government placed many Aboriginal children in residential schools to assimilate them. The schools were badly run and many students were abused."],
["who","In what year did the Government of Canada formally apologize for residential schools?","2008",["1982","1995","1967"],"In 2008 Ottawa formally apologized to former students of the residential schools."],
["who","What are Canada's two official languages?","English and French",["English and Inuktitut","French and Cree","English and Spanish"],"English and French are Canada's two official languages and are important symbols of identity."],
["who","What do the great majority of Canadians identify as religiously?","Christian",["Muslim","Buddhist","No religion"],"The great majority of Canadians identify as Christians. The largest religious community is Catholic."],

["history","Who were the first Europeans to reach Canada, about 1,000 years ago?","The Vikings",["The French","The Spanish","The Portuguese"],"The Vikings from Iceland reached Labrador and Newfoundland about 1,000 years ago. Their settlement at L'Anse aux Meadows is a World Heritage Site."],
["history","Who was the first explorer to draw a map of Canada's Atlantic shore, in 1497?","John Cabot",["Jacques Cartier","Samuel de Champlain","Henry Hudson"],"John Cabot, an Italian immigrant to England, was the first to map Canada's Atlantic shore, landing in Newfoundland or Cape Breton in 1497 and claiming the land for England."],
["history","Who made three voyages to Canada between 1534 and 1542 and claimed the land for the King of France?","Jacques Cartier",["John Cabot","Samuel de Champlain","Pierre de Monts"],"Jacques Cartier made three voyages across the Atlantic between 1534 and 1542, claiming the land for King Francis I of France."],
["history","Where does the name Canada come from?","The Iroquoian word kanata, meaning village",["A French word meaning cold land","A Latin word meaning sea to sea","An English word for open country"],"Cartier heard two captured guides speak the Iroquoian word kanata, meaning village. By the 1550s the name Canada was appearing on maps."],
["history","Who founded Quebec City in 1608?","Samuel de Champlain",["Jacques Cartier","Louis de Frontenac","Pierre Le Moyne"],"In 1604 Pierre de Monts and Samuel de Champlain started the first European settlement north of Florida. In 1608 Champlain built a fortress at what is now Quebec City."],
["history","What did King Charles II grant the Hudson's Bay Company in 1670?","Exclusive trading rights over the Hudson Bay watershed",["Ownership of all of New France","The right to build the national railway","Control of the fishery in Newfoundland"],"In 1670 King Charles II granted the Hudson's Bay Company exclusive trading rights over the watershed draining into Hudson Bay."],
["history","What happened at the Battle of the Plains of Abraham in 1759?","The British defeated the French at Quebec City, ending France's empire in America",["The Americans invaded Upper Canada","The Fathers of Confederation met","Louis Riel was captured"],"In 1759 the British defeated the French at the Battle of the Plains of Abraham at Quebec City. Both generals, Wolfe and Montcalm, were killed."],
["history","What did the Quebec Act of 1774 do?","Allowed religious freedom for Catholics, let them hold public office, and restored French civil law",["Divided Quebec into two provinces","Created the Dominion of Canada","Made French the only official language"],"The Quebec Act of 1774 allowed religious freedom for Catholics, let them hold public office, and restored French civil law while keeping British criminal law."],
["history","Who were the United Empire Loyalists?","People loyal to the Crown who came to Canada from the United States during and after the American Revolution",["Soldiers who fought for France","Settlers from Scotland in 1820","Members of the first Parliament"],"More than 40,000 Loyalists who stayed faithful to the Crown fled the United States and settled in Nova Scotia and Quebec. Joseph Brant led Mohawk Loyalists into Canada."],
["history","What did the Constitutional Act of 1791 do?","Divided the Province of Quebec into Upper Canada and Lower Canada",["United all the colonies into one country","Abolished slavery everywhere in the Empire","Granted women the right to vote"],"The Constitutional Act of 1791 divided the Province of Quebec into Upper Canada (later Ontario) and Lower Canada (later Quebec)."],
["history","Where was the first representative assembly elected, in 1758?","Halifax, Nova Scotia",["Quebec City","Toronto","Charlottetown"],"The first representative assembly was elected in Halifax, Nova Scotia, in 1758."],
["history","In 1793, Upper Canada became the first province in the British Empire to do what?","Move toward abolishing slavery",["Give women the vote","Build a railway","Create a police force"],"In 1793 Upper Canada, led by Lieutenant Governor John Graves Simcoe, became the first province in the Empire to move toward the abolition of slavery."],

const weak=id=>{const s=S.stats[id];return s&&s.w>0&&s.s<2};

const SPK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>`;
let P={auto:true,rate:1,voice:"",think:4};
try{Object.assign(P,JSON.parse(localStorage.getItem(KEY+"-prefs")||"{}"))}catch(e){}
function savePrefs(){try{localStorage.setItem(KEY+"-prefs",JSON.stringify(P))}catch(e){}}
const TTS="speechSynthesis" in window;
let voices=[];
// Best voices first: premium/enhanced/natural downloads, then Google, then the rest. Novelty voices are hidden.
const NOVELTY=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/i;
const vScore=v=>(/premium/i.test(v.name)?60:0)+(/enhanced|natural|neural/i.test(v.name)?40:0)+(/google/i.test(v.name)?25:0)+(v.localService?5:0)+(/en[-_]CA/i.test(v.lang)?3:0)+(/en[-_](US|GB)/i.test(v.lang)?2:0);
function loadVoices(){if(!TTS)return;voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!NOVELTY.test(v.name)).sort((a,b)=>vScore(b)-vScore(a))}
if(TTS){loadVoices();speechSynthesis.addEventListener?.("voiceschanged",()=>{loadVoices();if(view==="settings")render()})}
function pickVoice(){return voices.find(v=>v.voiceURI===P.voice)||voices[0]}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let gen=0;
function stopSpeak(){gen++;if(TTS)speechSynthesis.cancel()}
function say(parts){
  if(!TTS) return Promise.resolve(false);
  stopSpeak(); const g=gen;
  return (async()=>{
    for(const p of parts){
      if(g!==gen) return false;
      if(typeof p==="number"){await wait(p);continue}
      await new Promise(res=>{
        const u=new SpeechSynthesisUtterance(p),v=pickVoice();
        if(v){u.voice=v;u.lang=v.lang}
        u.rate=P.rate; u.onend=u.onerror=()=>res(); speechSynthesis.speak(u);
        setTimeout(res,Math.max(8000,p.length*160/P.rate)); // safety if a browser never fires onend
      });
    }
    return g===gen;
  })();
}
const readOpts=o=>o.flatMap((t,k)=>[(k+1)+". "+t,250]);
function sayQuestion(q,o){return say([q.q,500,...readOpts(o)])}
function speakBtn(){return TTS?`<button class="speak" data-act="readq">${SPK} Read aloud</button>`:""}
let wakeLock=null;
async function keepAwake(on){try{if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const opts=q=>shuffle([q.a,...q.w]);

let view="home", sess=null, timerId=null, chSel="all";
const app=document.getElementById("app");

function go(v){
  view=v; sess=null; clearInterval(timerId); stopSpeak(); keepAwake(false);
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===v));
  try{localStorage.setItem(KEY+"-view",v)}catch(e){}
  render(); window.scrollTo(0,0);
}

function render(){
  if(view==="home") app.innerHTML=home();
  else if(view==="learn") app.innerHTML=learn();
  else if(view==="cards") app.innerHTML=sess?cardView():picker("cards","Flashcards","Flip a card, say the answer in your head, then mark how you did. Cards you know twice in a row count as mastered.","Start flashcards");
  else if(view==="practice") app.innerHTML=sess?(sess.done?practiceDone():practiceView()):picker("practice","Practice","Ten questions at a time, with the answer and the fact behind it after each one.","Start 10 questions");
  else if(view==="mock") app.innerHTML=sess?(sess.done?mockDone():mockView()):mockIntro();
  else if(view==="listen") app.innerHTML=sess?listenView():picker("listen","Listen","Hands-free study. The app reads each question and the four choices, gives you a few seconds to think, then reads the answer and the fact behind it. Good for the car or the kitchen.","Start listening");
  else if(view==="settings") app.innerHTML=settingsView();
}

/* hands-free listen mode */
async function listenLoop(){
  const s=sess;
  while(s===sess&&!s.paused&&s.i<s.qs.length){
    const q=s.qs[s.i]; s.phase="q"; render();
    let ok=await say(["Question "+(s.i+1)+".",q.q,500,...readOpts(s.o[s.i]),P.think*1000]);
    if(!ok||s!==sess||s.paused) return;
    s.phase="a"; render();
    ok=await say(["The answer is: "+q.a+".",300,q.e,1500]);
    if(!ok||s!==sess||s.paused) return;
    s.i++;
  }
  if(s===sess&&s.i>=s.qs.length){s.phase="done";render();keepAwake(false);say(["That's the end of this set. Well done."])}
}
function listenView(){
  const s=sess,n=s.qs.length;
  if(s.phase==="done") return `<div class="stack" style="gap:18px"><div class="label">Listening finished</div><h2>You went through ${n} questions.</h2><div class="row"><button class="btn primary" data-start="listen" data-ch="${chSel}">Listen again</button><button class="btn" data-start="practice" data-ch="${chSel}">Test myself on these</button></div></div>`;
  const q=s.qs[Math.min(s.i,n-1)],showA=s.phase==="a";
  return `<div class="stack" style="gap:18px">
  <div class="qhead"><span class="label">${chName(q.c)}</span><span class="mono muted">${s.i+1} / ${n}</span></div>
  <div class="progress"><i style="width:${s.i/n*100}%"></i></div>
  <div class="panel listen-now">
    <div class="phase">${s.paused?"Paused":showA?"Answer":"Question · think about it"}</div>
    <div class="qtext">${q.q}</div>
    ${showA?`<div><div class="ok">${q.a}</div><div class="muted">${q.e}</div></div>`:`<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">${s.o[s.i].map(t=>`<li>${t}</li>`).join("")}</ol>`}
  </div>
  <div class="bigctl">
    <button class="btn" data-act="lback" ${s.i===0?"disabled":""}>Back</button>
    <button class="btn primary" data-act="${s.paused?"lplay":"lpause"}">${s.paused?"Play":"Pause"}</button>
    <button class="btn" data-act="lskip">Skip</button>
  </div>
  <p class="note" style="margin:0;text-align:center">Keep the app open. The screen stays on while you listen.</p>
  </div>`;
}

  const vs=voices,cur=pickVoice();
  return `<div class="stack" style="gap:20px">
  <h1>Settings</h1>
  <section>
    <div class="label">Reading aloud</div>
    ${TTS?`
    <div class="set"><label for="s-auto">Read questions automatically<small>In practice, flashcards and the mock test</small></label><input id="s-auto" type="checkbox" class="switch" ${P.auto?"checked":""}></div>
    <div class="set"><label for="s-voice">Voice<small>Voices come from your phone</small></label><select id="s-voice">${vs.length?vs.map(v=>`<option value="${v.voiceURI.replace(/"/g,"&quot;")}" ${cur&&v.voiceURI===cur.voiceURI?"selected":""}>${v.name} (${v.lang})</option>`).join(""):`<option>Default voice</option>`}</select></div>
    <div class="set"><label for="s-rate">Speed<small class="mono">${P.rate.toFixed(1)}×</small></label><input id="s-rate" type="range" min="0.6" max="1.4" step="0.1" value="${P.rate}"></div>
    <div class="set"><label for="s-think">Thinking time in Listen<small>Pause before the answer</small></label><select id="s-think">${[2,4,6,8,10].map(t=>`<option value="${t}" ${P.think==t?"selected":""}>${t} seconds</option>`).join("")}</select></div>
    <div class="panel stack" style="gap:8px;margin-top:14px;font-size:14px">
      <b>Want a nicer voice? Download one free (one time):</b>
      <div><b>iPhone:</b> Settings → Accessibility → Spoken Content → Voices → English → tap a voice marked <b>Premium</b> or <b>Enhanced</b> (Ava, Zoe or Evan sound good) → download. Then close this app fully, reopen it and pick that voice above.</div>
      <div><b>Android:</b> Settings → search <b>Text-to-speech</b> → Speech Services by Google ⚙ → Install voice data → English (Canada or US) → pick a voice. Then reopen this app and choose it above.</div>
    </div>
    <div style="padding-top:14px"><button class="btn" data-act="testvoice">${SPK.replace('aria-hidden','width="16" height="16" aria-hidden')} Test the voice</button></div>

  </section>
  <section class="stack" style="gap:10px">
    <div class="label">Install on your phone</div>
    <div class="panel stack" style="gap:10px">
      <div><b>iPhone:</b> open this page in Safari, tap the Share button (square with an arrow), then <b>Add to Home Screen</b>.</div>
      <div><b>Android:</b> open this page in Chrome, tap the ⋮ menu, then <b>Add to Home screen</b> or <b>Install app</b>.</div>

    <p class="muted" style="margin:0">${Object.keys(S.stats).length} questions practised · ${S.mocks.length} mock tests taken on this phone.</p>
    <div class="row">${S.confirmReset?`<span>Erase all progress on this phone?</span><button class="btn primary" data-act="reset">Yes, erase</button><button class="btn" data-act="noreset">Cancel</button>`:`<button class="btn" data-act="askreset">Reset my progress</button>`}</div>
  </section>
  </div>`;
}
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="s-auto"){P.auto=t.checked;savePrefs()}
  else if(t.id==="s-voice"){P.voice=t.value;savePrefs();say(["Hello Uche. This is how I sound."])}
  else if(t.id==="s-think"){P.think=+t.value;savePrefs()}
  else if(t.id==="s-rate"){P.rate=+t.value;savePrefs();render();say(["This is the new speed."])}
});
document.addEventListener("input",e=>{if(e.target.id==="s-rate"){const l=e.target.closest(".set")?.querySelector("small");if(l)l.textContent=(+e.target.value).toFixed(1)+"×"}});

  const m=Q.filter(q=>mastered(q.id)).length, pct=Math.round(m/Q.length*100);
  const seen=Object.keys(S.stats).length, wk=Q.filter(q=>weak(q.id)).length;
  const last=S.mocks.slice(-8);
  return `<div class="stack" style="gap:28px">
  <section class="hero">
    <div class="ring" style="--p:${pct}"><div><div><b>${pct}%</b><small>mastered</small></div></div></div>
    <div class="stack" style="gap:8px">
      <h1>${seen?"Keep going. You're building it.":"Get ready for your citizenship test"}</h1>

      <div class="row" style="margin-top:6px">
        <button class="btn primary" data-go="mock">Take a mock test</button>
        <button class="btn" data-start="practice" data-ch="${wk?"weak":"all"}">${wk?"Review "+wk+" weak spots":"Quick practice"}</button>
        ${TTS?`<button class="btn" data-start="listen" data-ch="all">${SPK.replace('aria-hidden','width="16" height="16" style="vertical-align:-3px" aria-hidden')} Listen hands-free</button>`:""}

    <div class="row" style="justify-content:space-between"><div class="label">Mock test history</div></div>
    ${last.length?`<div class="mocks">${last.map(x=>`<span class="chip ${x.s>=15?"pass":""}">${x.s}/20</span>`).join("")}</div>`:`<p class="muted" style="margin:0">No mock tests yet. Your scores will show here.</p>`}

    <div class="chlist">${CH.map((c,i)=>{const qs=byCh(c.k),mm=qs.filter(q=>mastered(q.id)).length,p=Math.round(mm/qs.length*100);

function learn(){
  return `<div class="stack" style="gap:20px">
  <div class="stack" style="gap:8px"><h1>Study guide</h1><p class="muted" style="margin:0;max-width:65ch">The key facts from each chapter of Discover Canada. Read a chapter, then practise it.</p></div>
  <div>${CH.map((c,i)=>`<details class="chap"${i===0?" open":""}><summary><span><span class="mono muted">${String(i+1).padStart(2,"0")}</span>&nbsp; ${c.n}</span></summary><div class="body stack" style="gap:14px"><ul class="facts">${byCh(c.k).map(q=>`<li>${q.e}</li>`).join("")}</ul><div><button class="btn sm" data-start="practice" data-ch="${c.k}">Practise this chapter</button></div></div></details>`).join("")}</div>
  <div class="panel stack" style="gap:8px"><h3>Know your own area</h3><p style="margin:0;max-width:65ch">The test can ask about where you live. Look up and learn: your provincial capital, your Premier, your member of Parliament and your riding, and the name of your mayor.</p></div>
  </div>`;
}

function picker(mode,title,blurb,cta){
  const items=[["all","All chapters",Q.length],["weak","Weak spots",Q.filter(q=>weak(q.id)).length],...CH.map(c=>[c.k,c.n,byCh(c.k).length])];
  return `<div class="stack" style="gap:20px">
  <div class="stack" style="gap:8px"><h1>${title}</h1><p class="muted" style="margin:0;max-width:65ch">${blurb}</p></div>
  <div class="stack" style="gap:10px"><div class="label">Choose what to study</div>
  <div class="pick">${items.map(([k,n,ct])=>`<button data-pick="${k}" aria-pressed="${chSel===k}"${ct?"":" disabled"}>${n} <span class="mono muted">${ct}</span></button>`).join("")}</div></div>
  <div><button class="btn primary" data-start="${mode}" data-ch="${chSel}">${cta}</button></div>
  </div>`;
}
function poolFor(ch){
  if(ch==="weak") return Q.filter(q=>weak(q.id));
  if(ch==="all") return Q;
  return byCh(ch);
}
function start(mode,ch){
  chSel=ch; let pool=poolFor(ch); if(!pool.length){pool=Q;chSel="all"}
  clearInterval(timerId); stopSpeak(); keepAwake(false);
  if(mode==="listen"){ view="listen"; const qs=shuffle(pool).slice(0,20); sess={qs,i:0,o:qs.map(opts),phase:"q",paused:false}; keepAwake(true); }
  if(mode==="practice"){ view="practice"; const qs=shuffle(pool).slice(0,10); sess={qs,i:0,o:opts(qs[0]),pick:null,score:0,ch:chSel}; }
  if(mode==="cards"){ view="cards"; const qs=shuffle(pool); sess={qs,i:0,flip:false,known:0}; }
  if(mode==="mock"){ view="mock"; const qs=shuffle(Q).slice(0,20); sess={qs,i:0,o:qs.map(opts),ans:Array(20).fill(null),end:Date.now()+30*60*1000}; timerId=setInterval(tick,1000); }
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===view));
  render(); window.scrollTo(0,0);
  if(mode==="listen") listenLoop(); else autoRead();
}
function autoRead(){ if(P.auto) readCurrent(); }
function readCurrent(){
  const s=sess; if(!s||s.done) return;
  if(view==="practice"){ const q=s.qs[s.i]; if(s.pick==null) sayQuestion(q,s.o); else say([s.pick===q.a?"Correct.":"Not quite. The answer is: "+q.a+".",300,q.e]); }
  else if(view==="mock") sayQuestion(s.qs[s.i],s.o[s.i]);
  else if(view==="cards"&&s.i<s.qs.length){ const q=s.qs[s.i]; s.flip?say([q.a+".",300,q.e]):say([q.q]); }
}

function optList(o,state){
  return `<div class="opts">${o.map((t,i)=>`<button class="opt ${state(t)}" data-opt="${i}" ${state(t)&&state(t)!=="sel"&&view==="practice"?"disabled":""}${sess.pick!=null&&view==="practice"?" disabled":""}><span class="k">${i+1}</span><span>${t}</span></button>`).join("")}</div>`;
}

function practiceView(){
  const s=sess,q=s.qs[s.i],n=s.qs.length;
  const st=t=>s.pick==null?"":(t===q.a?"right":(t===s.pick?"wrong":""));
  const ok=s.pick===q.a;
  return `<div class="stack" style="gap:18px">
  <div class="qhead"><span class="label">${chName(q.c)}</span><span class="row" style="gap:10px">${speakBtn()}<span class="mono muted">${s.i+1} / ${n}</span></span></div>
  <div class="progress"><i style="width:${(s.i+(s.pick!=null?1:0))/n*100}%"></i></div>
  <div class="qtext">${q.q}</div>
  ${optList(s.o,st)}
  ${s.pick!=null?`<div class="explain ${ok?"":"no"}"><div class="${ok?"ok":"no"}">${ok?"Correct":"Not quite. The answer is: "+q.a}</div><div>${q.e}</div></div>
  <div><button class="btn primary" data-act="next">${s.i+1<n?"Next question":"See results"}</button></div>`:`<p class="note" style="margin:0">Tip: press 1–4 to answer.</p>`}
  </div>`;
}
function practiceDone(){
  const s=sess,n=s.qs.length;
  return `<div class="stack" style="gap:18px">
  <div class="label">Practice complete</div>
  <div class="row" style="align-items:baseline"><span class="score">${s.score}/${n}</span><span class="muted">${Math.round(s.score/n*100)}% correct</span></div>
  <div class="row"><button class="btn primary" data-start="practice" data-ch="${s.ch}">Another 10</button><button class="btn" data-start="practice" data-ch="weak">Review weak spots</button><button class="btn" data-go="home">Back to overview</button></div>
  </div>`;
}

function cardView(){
  const s=sess;
  if(s.i>=s.qs.length) return `<div class="stack" style="gap:18px"><div class="label">Deck finished</div><div class="row" style="align-items:baseline"><span class="score">${s.known}/${s.qs.length}</span><span class="muted">known</span></div><div class="row"><button class="btn primary" data-start="cards" data-ch="${chSel}">Go again</button><button class="btn" data-start="cards" data-ch="weak">Weak spots only</button><button class="btn" data-go="home">Back to overview</button></div></div>`;
  const q=s.qs[s.i];
  return `<div class="stack" style="gap:18px">
  <div class="qhead"><span class="label">${chName(q.c)}</span><span class="mono muted">${s.i+1} / ${s.qs.length}</span></div>
  <div class="card3d ${s.flip?"flip":""}" data-act="flip" role="button" tabindex="0" aria-label="Flip card">
    <div class="inner"><div class="face"><div class="label">Question</div><div class="qtext">${q.q}</div><div class="muted" style="font-size:14px">Tap or press space to flip</div></div>

  </div>
  <div class="row">${s.flip?`<button class="btn primary" data-act="knew">I knew it</button><button class="btn" data-act="again">Still learning</button>`:`<button class="btn primary" data-act="flip">Show answer</button>`}${speakBtn()}</div>
  </div>`;

function mockIntro(){
  return `<div class="stack" style="gap:20px">
  <div class="stack" style="gap:8px"><h1>Mock test</h1><p class="muted" style="margin:0;max-width:65ch">Twenty questions from every chapter, timed like the real test. You won't see answers until you submit, and you can go back and change any answer before then.</p></div>
  <div class="format"><div><b>20</b><span>questions</span></div><div><b>30:00</b><span>on the clock</span></div><div><b>15</b><span>correct to pass</span></div></div>
  <div><button class="btn primary" data-start="mock" data-ch="all">Start the test</button></div>
  </div>`;
}
function fmt(ms){ms=Math.max(0,ms);const t=Math.ceil(ms/1000);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function tick(){
  if(!sess||sess.done) return clearInterval(timerId);
  const left=sess.end-Date.now(), el=document.getElementById("timer");
  if(el){el.textContent=fmt(left);el.classList.toggle("low",left<5*60e3)}
  if(left<=0) submitMock();
}
function mockView(){
  const s=sess,q=s.qs[s.i],o=s.o[s.i],a=s.ans[s.i],answered=s.ans.filter(x=>x!=null).length,left=s.end-Date.now();
  return `<div class="stack" style="gap:18px">
  <div class="qhead"><span class="mono muted">Question ${s.i+1} of 20 · ${answered} answered</span><span id="timer" class="timer ${left<5*60e3?"low":""}">${fmt(left)}</span></div>
  <div class="grid20">${s.qs.map((_,i)=>`<button data-jump="${i}" class="${s.ans[i]!=null?"done":""} ${i===s.i?"cur":""}" aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div>
  <div class="row" style="justify-content:flex-end">${speakBtn()}</div>
  <div class="qtext">${q.q}</div>
  <div class="opts">${o.map((t,i)=>`<button class="opt ${a===t?"sel":""}" data-opt="${i}"><span class="k">${i+1}</span><span>${t}</span></button>`).join("")}</div>
  <div class="row" style="justify-content:space-between">
    <div class="row"><button class="btn" data-act="prev" ${s.i===0?"disabled":""}>Back</button><button class="btn" data-act="mnext" ${s.i===19?"disabled":""}>Next</button></div>
    ${s.confirm?`<div class="row"><span class="muted">${20-answered} unanswered. Submit anyway?</span><button class="btn primary" data-act="submit">Yes, submit</button><button class="btn" data-act="nosubmit">Keep going</button></div>`:`<button class="btn primary" data-act="trysubmit">Submit test</button>`}
  </div>
  </div>`;
}
function submitMock(){
  const s=sess; if(!s||s.done) return;
  clearInterval(timerId); s.done=true;
  s.score=s.qs.filter((q,i)=>s.ans[i]===q.a).length;
  s.qs.forEach((q,i)=>record(q.id,s.ans[i]===q.a));
  S.mocks.push({s:s.score,d:Date.now()}); S.mocks=S.mocks.slice(-30); save();
  render(); window.scrollTo(0,0);
}
function mockDone(){
  const s=sess,pass=s.score>=15,missed=s.qs.map((q,i)=>({q,a:s.ans[i]})).filter(x=>x.a!==x.q.a);
  return `<div class="stack" style="gap:22px">
  <div class="stack" style="gap:10px"><div class="label">Mock test result</div>
  <div class="row" style="align-items:baseline"><span class="score">${s.score}/20</span><span class="${pass?"ok":"no"}">${pass?"Pass":"Not a pass yet"}</span></div>
  <p class="muted" style="margin:0">${pass?"You reached the 15 needed to pass. Keep taking mock tests until you pass comfortably every time.":"You need 15 correct to pass. Go through the questions below, then try again."}</p></div>
  <div class="row"><button class="btn primary" data-start="mock" data-ch="all">New mock test</button><button class="btn" data-start="practice" data-ch="weak">Practise weak spots</button></div>
  ${missed.length?`<section class="stack" style="gap:12px"><h2>Review ${missed.length} missed</h2><div class="review">${missed.map(({q,a})=>`<div class="item stack" style="gap:6px"><div class="label">${chName(q.c)}</div><div style="font-weight:600">${q.q}</div><div><span class="no">Your answer:</span> ${a==null?"No answer":a}</div><div><span class="ok">Correct:</span> ${q.a}</div><div class="muted">${q.e}</div></div>`).join("")}</div></section>`:""}
  </div>`;
}

function choose(i){
  const s=sess; if(!s) return;
  if(view==="practice"&&!s.done&&s.pick==null){
    const t=s.o[i]; if(t==null) return; s.pick=t; const ok=t===s.qs[s.i].a; if(ok)s.score++; record(s.qs[s.i].id,ok); render(); autoRead();
  } else if(view==="mock"&&!s.done){
    const t=s.o[s.i][i]; if(t==null) return; s.ans[s.i]=t; s.confirm=false; render();
  }
}
function act(a){
  const s=sess;
  if(a==="readq") readCurrent();
  else if(a==="testvoice") say(["Hello Uche. Who is Canada's Head of State?",600,"The Sovereign, King Charles the Third."]);
  else if(a==="askreset"){ S.confirmReset=true; render(); }
  else if(a==="noreset"){ delete S.confirmReset; render(); }
  else if(a==="reset"){ S={stats:{},mocks:[]}; save(); render(); }
  else if(a==="lpause"){ s.paused=true; stopSpeak(); keepAwake(false); render(); }
  else if(a==="lplay"){ s.paused=false; keepAwake(true); render(); listenLoop(); }
  else if(a==="lskip"||a==="lback"){ stopSpeak(); s.i=a==="lskip"?s.i+1:Math.max(0,s.i-1); s.phase="q"; render(); if(!s.paused) setTimeout(listenLoop,50); }
  else if(a==="next"){ stopSpeak(); if(s.i+1<s.qs.length){s.i++;s.o=opts(s.qs[s.i]);s.pick=null}else s.done=true; render(); autoRead(); }
  else if(a==="flip"){ s.flip=!s.flip; render(); if(s.flip) autoRead(); else stopSpeak(); }
  else if(a==="knew"||a==="again"){ record(s.qs[s.i].id,a==="knew"); if(a==="knew")s.known++; s.i++; s.flip=false; render(); stopSpeak(); autoRead(); }
  else if(a==="prev"){ s.i=Math.max(0,s.i-1); s.confirm=false; render(); autoRead(); }
  else if(a==="mnext"){ s.i=Math.min(19,s.i+1); s.confirm=false; render(); autoRead(); }
  else if(a==="trysubmit"){ if(s.ans.every(x=>x!=null)) submitMock(); else {s.confirm=true; render();} }
  else if(a==="nosubmit"){ s.confirm=false; render(); }
  else if(a==="submit") submitMock();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go],[data-start],[data-pick],[data-opt],[data-act],[data-jump]"); if(!b||b.disabled) return;
  if(b.dataset.go) go(b.dataset.go);
  else if(b.dataset.start) start(b.dataset.start,b.dataset.ch);
  else if(b.dataset.pick){ chSel=b.dataset.pick; render(); }
  else if(b.dataset.opt!=null) choose(+b.dataset.opt);
  else if(b.dataset.jump!=null){ sess.i=+b.dataset.jump; sess.confirm=false; render(); autoRead(); }
  else if(b.dataset.act) act(b.dataset.act);
});
document.addEventListener("keydown",e=>{
  if(!sess||e.metaKey||e.ctrlKey||e.altKey) return;
  if(/^[1-4]$/.test(e.key)&&(view==="practice"||view==="mock")) choose(+e.key-1);
  else if(e.key==="Enter"&&view==="practice"&&sess.pick!=null&&!sess.done){e.preventDefault();act("next")}
  else if(e.key===" "&&view==="cards"&&sess.i<sess.qs.length){e.preventDefault();act("flip")}
  else if(view==="mock"&&!sess.done&&e.key==="ArrowRight") act("mnext");
  else if(view==="mock"&&!sess.done&&e.key==="ArrowLeft") act("prev");
});

let startView="home"; try{startView=localStorage.getItem(KEY+"-view")||"home"}catch(e){}
if(!["home","learn","cards","practice","mock","listen","settings"].includes(startView)) startView="home";
go(startView);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&view==="listen"&&sess&&!sess.paused) keepAwake(true)});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
